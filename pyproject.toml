[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-timeline"
version = "0.1.0"
description = "Historial diario del almacenamiento de tus discos: gráficas de uso y qué se agregó."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Facundo" }]
keywords = ["disk", "storage", "disk-usage", "windows", "history", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/zFacuh/disk-timeline"
Documentation = "https://github.com/zFacuh/disk-timeline#readme"
Issues = "https://github.com/zFacuh/disk-timeline/issues"
Changelog = "https://github.com/zFacuh/disk-timeline/blob/main/CHANGELOG.md"

[project.scripts]
disk-timeline = "disk_timeline.cli:main"

[tool.setuptools]
packages = ["disk_timeline"]

[tool.setuptools.package-data]
disk_timeline = ["web/*"]
